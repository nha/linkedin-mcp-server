[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# A plain pytest never opens a browser window on the machine running it (headed Chromium appeared on a
# developer's screen): the browser tests run only when asked by name (-m browser_identity), or with -m "" as CI does.
# This file, not pyproject.toml, since pytest reads pytest.ini first and then ignores [tool.pytest.ini_options].
addopts = -v --strict-markers -ra -m "not browser_identity and not browser_dom and not browser_contract"
markers =
    browser_dom: evaluates extractor JS against a real chromium DOM; skipped when no browser is installed
    browser_contract: measures browser API behavior against real Chromium; skipped when no browser is installed
    slow: spawns real server processes; each case starts the full server graph
    image_build: shells out to a docker daemon; skipped where there is none
    browser_identity: the identity gate; fails rather than skips in CI
    real_control_peer: starts a real owner that attaches to the control rendezvous itself, so no stand-in peer is planted
    real_gate: uses the real LinkedIn gate client instead of the allowing stand-in (tests/test_gate.py)
